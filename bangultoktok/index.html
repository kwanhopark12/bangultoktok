<body>

<div class="home-wrap">
  <div class="home-hero">
    <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
      <path d="M50 60 C40 60 34 50 40 40 C44 34 50 34 50 40" stroke="#2f6b3f" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 60 C60 60 66 50 60 40 C56 34 50 34 50 40" stroke="#2f6b3f" stroke-width="4" stroke-linecap="round"/>
      <line x1="50" y1="40" x2="50" y2="65" stroke="#2f6b3f" stroke-width="4" stroke-linecap="round"/>
      <path d="M25 65 L75 65 L70 90 L30 90 Z" fill="#c99a63"/>
      <ellipse cx="50" cy="65" rx="26" ry="5" fill="#8a6a43"/>
    </svg>
    <h1>🍅 방울톡톡</h1>
    <p class="home-tagline">우리 집 방울토마토를 스마트하게 돌봐요</p>
  </div>

  <a class="home-summary" id="homeSummary" href="plant.html">화분 상태 불러오는 중...</a>

  <div class="home-nav">
    <a class="nav-card" href="plant.html">
      <div class="nav-card-icon">🌱</div>
      <div class="nav-card-title">나의 식물</div>
      <div class="nav-card-desc">지금 화분 상태를 실시간으로 확인해요</div>
    </a>
    <a class="nav-card" href="records.html">
      <div class="nav-card-icon">📈</div>
      <div class="nav-card-title">나의 식물의 기록</div>
      <div class="nav-card-desc">지금까지 쌓인 기록을 한눈에 살펴봐요</div>
    </a>
  </div>

  <div class="home-footer-links">
    <a class="pill-link" href="settings.html">⚙️ 설정 · 연결 확인</a>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script>
async function loadSummary() {
  let data, demo = false;
  try { data = await fetchLatestByPot(); }
  catch (e) { data = getDemoLatest(); demo = true; }

  const counts = { dry: [], optimal: [], wet: [] };
  POT_IDS.forEach((id) => {
    const key = classifyMoisture(data[id]?.soil);
    if (counts[key]) counts[key].push(id);
  });

  const parts = [`🌱 좋음 <b>${counts.optimal.length}</b>`];
  parts.push(counts.dry.length ? `🌵 물 필요 <b>${counts.dry.join(", ")}</b>` : `🌵 물 필요 <b>0</b>`);
  if (counts.wet.length) parts.push(`💧 너무 많음 <b>${counts.wet.join(", ")}</b>`);
  const env = data._env || {};
  if (env.temp != null) parts.push(`🌡️ <b>${env.temp.toFixed(1)}°C</b>`);
  if (env.humidity != null) parts.push(`💦 <b>${env.humidity.toFixed(0)}%</b>`);
  if (demo) parts.push(`<span>(데모)</span>`);
  document.getElementById("homeSummary").innerHTML = parts.map((p) => `<span>${p}</span>`).join("");
}
startAutoRefresh(loadSummary);
</script>
</body>
</html>
